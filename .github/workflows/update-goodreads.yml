name: Update Goodreads data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-goodreads:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Goodreads shelves
        run: node scripts/update-goodreads.mjs > goodreads.json

      - name: Commit updated data
        run: |
          if ! git diff --quiet -- goodreads.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add goodreads.json
            git commit -m 'Update Goodreads reading data'
            git push
          fi
